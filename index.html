<title>Omega Trade Route Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap">
<style id="otr-css">:root{
  /* Layout: a cargo-manifest storefront. A navy route band carries the live batch ticket, the catalogue sits in a crate grid, and the order is a waybill. */
  --ground:#070D19;
  --surface:#0D1729;
  --surface-2:#14223B;
  --line:#22324F;
  --line-2:#32466D;
  --ink:#EDF1F8;
  --ink-2:#A9B5CC;
  --ink-3:#7A86A3;
  --gold:#E2B03B;
  --gold-hi:#F0C75E;
  --gold-ink:#EBC25A;
  --on-gold:#191104;
  --band:#0A1630;
  --band-2:#163063;
  --band-ink:#EEF2FA;
  --band-ink-2:#B6C2DA;
  --band-line:#2A4474;
  --band-grid:rgba(132,160,214,.07);
  --tag:#F8F9FC;
  --tag-ink:#0B1631;
  --tag-ink-2:#46536F;
  --tag-ink-3:#6E7A93;
  --tag-line:#D8DDE8;
  --tag-line-2:#AEB8CB;
  --tag-gold:#8F6405;
  --tag-ok:#16734F; --tag-ok-line:#9CD3BC; --tag-ok-bg:#E9F6F0;
  --tag-warn:#8A5408; --tag-warn-line:#E4C48E; --tag-warn-bg:#FBF2E2;
  --tile:#F2F3F6;
  --ok:#46BD91; --ok-bg:rgba(70,189,145,.14);
  --warn:#E7A740; --warn-bg:rgba(231,167,64,.15);
  --crit:#EC7266; --crit-bg:rgba(236,114,102,.14);
  --on-crit:#FFFFFF;
  --scrim:rgba(3,7,15,.68);
  --shadow:0 24px 60px rgba(0,0,0,.5);
  --shadow-tag:0 28px 60px rgba(0,0,0,.42);
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px;
  --r-sm:11px;
  --top-h:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#F1F3F7; --surface:#FFFFFF; --surface-2:#EAEEF5; --line:#D7DDE8; --line-2:#BDC7D8;
    --ink:#0B1631; --ink-2:#45526E; --ink-3:#6C7892;
    --gold:#DBA632; --gold-hi:#E8B84D; --gold-ink:#8A620C; --on-gold:#191104;
    --band:#0A1630; --band-2:#163063; --band-ink:#EEF2FA; --band-ink-2:#BAC5DC; --band-line:#2C477A; --band-grid:rgba(132,160,214,.08);
    --ok:#1C8760; --ok-bg:rgba(28,135,96,.11);
    --warn:#A3660A; --warn-bg:rgba(163,102,10,.11);
    --crit:#C0443A; --crit-bg:rgba(192,68,58,.1);
    --scrim:rgba(8,16,32,.5);
    --shadow:0 24px 60px rgba(10,22,48,.2);
    --shadow-tag:0 28px 60px rgba(4,10,24,.45);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ground:#F1F3F7; --surface:#FFFFFF; --surface-2:#EAEEF5; --line:#D7DDE8; --line-2:#BDC7D8;
  --ink:#0B1631; --ink-2:#45526E; --ink-3:#6C7892;
  --gold:#DBA632; --gold-hi:#E8B84D; --gold-ink:#8A620C; --on-gold:#191104;
  --band:#0A1630; --band-2:#163063; --band-ink:#EEF2FA; --band-ink-2:#BAC5DC; --band-line:#2C477A; --band-grid:rgba(132,160,214,.08);
  --ok:#1C8760; --ok-bg:rgba(28,135,96,.11);
  --warn:#A3660A; --warn-bg:rgba(163,102,10,.11);
  --crit:#C0443A; --crit-bg:rgba(192,68,58,.1);
  --scrim:rgba(8,16,32,.5);
  --shadow:0 24px 60px rgba(10,22,48,.2);
  --shadow-tag:0 28px 60px rgba(4,10,24,.45);
  color-scheme:light;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,dl,dd,figure{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:inherit}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
#otr svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#otr section{scroll-margin-top:calc(var(--top-h) + 8px)}

.wrap{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;z-index:200;background:var(--gold);color:var(--on-gold);padding:10px 14px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.display{font-family:var(--f-display);font-stretch:125%;font-weight:800;letter-spacing:-.012em}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:15px;line-height:1.2;text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s,transform .1s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.48;cursor:not-allowed;transform:none}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.gold:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{background:transparent}
.btn.add:hover{border-color:var(--gold)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:7px 14px;font-size:14px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.armed{background:var(--crit);border-color:var(--crit);color:var(--on-crit)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}

/* announcement + header */
.announce{background:var(--gold);color:var(--on-gold);font-weight:600;font-size:14px;text-align:center;padding:8px 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ground);background:color-mix(in srgb,var(--ground) 88%,transparent);-webkit-backdrop-filter:saturate(1.2) blur(12px);backdrop-filter:saturate(1.2) blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:var(--top-h)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0;flex:0 1 auto}
.brand img{width:50px;height:32px;object-fit:cover;border-radius:7px;flex:none;display:block}
.brand-txt{display:grid;min-width:0;line-height:1.1}
.brand-name{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;white-space:nowrap}
.top-nav{display:flex;gap:4px;margin-left:auto}
.top-nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:14.5px;font-weight:500}
.top-nav a:hover{color:var(--ink);background:var(--surface-2)}
.top-act{display:flex;align-items:center;gap:8px;margin-left:12px}
.cart-n{font-variant-numeric:tabular-nums;min-width:1ch}
@media (max-width:980px){.top-nav{display:none}.top-act{margin-left:auto}}
@media (max-width:560px){.hide-sm{display:none!important}.brand-sub{display:none}.top-act .btn.sm{padding:7px 11px}.brand-name{font-size:13.5px}}
@media (max-width:380px){.brand-name{letter-spacing:0}}

/* hero band */
.band{position:relative;background-color:var(--band);background-image:radial-gradient(70% 90% at 0% 0%,var(--band-2) 0%,transparent 72%),linear-gradient(var(--band-grid) 1px,transparent 1px),linear-gradient(90deg,var(--band-grid) 1px,transparent 1px);background-size:auto,56px 56px,56px 56px;color:var(--band-ink);border-bottom:1px solid var(--band-line)}
.hero{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:clamp(28px,5vw,72px);align-items:center;padding-block:clamp(36px,6.5vw,80px)}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:clamp(31px,5.2vw,60px);line-height:1.02;margin-top:16px;max-width:14ch;text-wrap:balance}
.hero h1 .hl{display:block}
.hero h1 .hl+.hl{margin-top:.42em;font-size:max(.48em,19px);line-height:1.2;letter-spacing:0;font-weight:700;color:var(--band-ink-2);max-width:26ch}
.lede{color:var(--band-ink-2);max-width:54ch;margin-top:18px;font-size:clamp(16px,1.6vw,18px)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.band .btn.ghost{color:var(--band-ink);border-color:var(--band-line)}
.band .btn.ghost:hover{border-color:var(--band-ink-2)}
.slogan{margin-top:26px;display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--band-ink-2)}
.slogan::before{content:"";width:28px;height:1px;background:var(--gold);flex:none}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.hero h1{max-width:none}}

/* batch ticket */
.ticket{position:relative;background:var(--tag);color:var(--tag-ink);border-radius:18px;box-shadow:var(--shadow-tag);padding:22px 22px 20px;max-width:460px;width:100%;justify-self:end}
@media (max-width:860px){.ticket{justify-self:stretch;max-width:none}}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.t-batch{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.t-pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--tag-line-2)}
.t-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-pill.open{color:var(--tag-ok);border-color:var(--tag-ok-line);background:var(--tag-ok-bg)}
.t-pill.closed{color:var(--tag-warn);border-color:var(--tag-warn-line);background:var(--tag-warn-bg)}
.t-count{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px;margin-top:18px}
.t-big{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(58px,9vw,84px);line-height:.86;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.t-big.word{font-size:clamp(34px,5vw,44px);line-height:1;overflow-wrap:anywhere}
.t-cap{font-size:14px;line-height:1.3;color:var(--tag-ink-2);padding-bottom:6px;max-width:16ch}
.t-perf{position:relative;border-top:2px dashed var(--tag-line-2);margin:20px -22px 16px}
.t-perf::before,.t-perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--band)}
.t-perf::before{left:-11px}.t-perf::after{right:-11px}
.t-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.t-rows dt{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tag-ink-3)}
.t-rows dd{font-size:14.5px;font-weight:600;margin-top:3px}
.route{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.route li{position:relative;padding-top:20px;font-family:var(--f-mono);font-size:9px;line-height:1.35;letter-spacing:.03em;text-transform:uppercase;color:var(--tag-ink-3);overflow-wrap:anywhere}
.route li::before{content:"";position:absolute;z-index:1;top:3px;left:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--tag-line-2);background:var(--tag)}
.route li::after{content:"";position:absolute;top:8px;left:14px;right:0;height:2px;background:var(--tag-line)}
.route li:last-child::after{display:none}
.route li.done::before{background:var(--tag-ink);border-color:var(--tag-ink)}
.route li.done::after{background:var(--tag-ink)}
.route li.on{color:var(--tag-ink);font-weight:500}
.route li.on::before{background:var(--gold);border-color:var(--tag-gold);box-shadow:0 0 0 4px rgba(226,176,59,.28)}
.t-note{margin-top:14px;font-size:12.5px;color:var(--tag-ink-2)}
.t-note a{color:var(--tag-gold);font-weight:600}

/* sections */
.sec{padding-block:clamp(44px,7vw,88px)}
.sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
.sec-head h2,.h2{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(23px,3.2vw,34px);line-height:1.08;margin-top:10px;letter-spacing:-.01em}
.sec-head p.count{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.sec-lede{color:var(--ink-2);max-width:60ch;margin-top:10px}

/* catalogue toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.search{position:relative;flex:1 1 240px;min-width:0}
.search input{width:100%;min-height:44px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);padding:10px 16px 10px 44px}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 15px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:14px;font-weight:500;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7}
.selectwrap{position:relative}
.selectwrap select{appearance:none;-webkit-appearance:none;min-height:44px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);padding:8px 40px 8px 16px;cursor:pointer}
.selectwrap svg{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(90deg);pointer-events:none;color:var(--ink-3);width:16px!important;height:16px!important}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
@media (max-width:540px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;transition:border-color .2s}
.card:hover{border-color:var(--line-2)}
.card-media{position:relative;display:block;width:100%;aspect-ratio:1/1;max-width:100%;background:var(--tile);border:0;padding:0;cursor:pointer;overflow:hidden}
.card-media img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.card:hover .card-media img{transform:scale(1.035)}
.card-media .ph{display:grid;place-items:center;width:100%;height:100%;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:44px;color:var(--gold);background:var(--band)}
.badge{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--band);color:var(--band-ink)}
.badge.sold{background:var(--crit);color:var(--on-crit)}
.card-body{display:flex;flex-direction:column;gap:6px;padding:14px 14px 16px;flex:1;min-width:0}
.cat{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.card h3{font-size:16px;line-height:1.3;font-weight:600}
.card h3 .linkbtn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.amt{font-family:var(--f-display);font-stretch:125%;font-weight:700;font-size:21px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt .cur{font-family:var(--f-body);font-weight:600;font-size:.62em;letter-spacing:0;margin-right:3px;color:var(--ink-2)}
.unit{font-size:12px;color:var(--ink-3)}
.ship{font-size:12.5px;line-height:1.4;color:var(--ink-3)}
.card-act{margin-top:auto;padding-top:10px}
.card-act .btn{width:100%;white-space:normal;text-align:center}
@media (max-width:540px){.card-body{padding:11px 11px 12px;gap:5px}.card h3{font-size:14.5px}.amt{font-size:17px}.ship{display:none}.card-act .btn{font-size:13.5px;padding:8px 10px;min-height:40px}}
.var-wrap{margin-top:2px}
.var-toggle{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font:inherit;font-size:12.5px;font-weight:500;color:var(--ink-3);cursor:pointer}
.var-toggle:hover{color:var(--ink)}
.var-caret{width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.var-toggle[aria-expanded="true"] .var-caret{transform:rotate(-135deg) translateY(-1px)}
.var-list{display:flex;flex-direction:column;gap:8px;padding:6px 0 2px}
.var-list[hidden]{display:none}
.var-group{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.var-lbl{flex-basis:100%;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.vchip{display:inline-flex;align-items:center;min-height:28px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font:inherit;font-size:12px;cursor:pointer}

  var ADMIN = { can: false, art: null, db: null, open: false, tab: 'products', editId: null, draft: null, dirty: false, stale: false, armed: null, publishing: false, problems: [], pubError: '' };

  function safeUse(name) {

    catch (e) { return Promise.resolve(null); }

  function initOwner() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    Promise.all([safeUse('artifact'), safeUse('user'), safeUse('db')]).then(function (r) {
      var art = r[0], user = r[1], db = r[2];
      if (!art || !user || typeof user.canEdit !== 'function') return null;
      return Promise.resolve(user.canEdit()).then(function (ok) {
        if (!ok) return;
        ADMIN.can = true; ADMIN.art = art; ADMIN.db = db || null; ordStart();
        renderTop(); renderFoot();
        if (ssGet(PUB_FLAG)) { ssDel(PUB_FLAG); toast('Published. Customers now see this version.', { ms: 5200 }); }
        restoreDraft();
      });
    }).catch(function () { });
  }

  /* draft storage */
  function sameAsPublished(d) { return JSON.stringify(core(d)) === PUBLISHED_JSON; }
  var saveDraftSoon = debounce(saveDraftNow, 500);
  function saveDraftNow() {
    if (!ADMIN.draft) return;
    if (!ADMIN.dirty) { lsDel(DRAFT_KEY); return; }
    if (!lsSet(DRAFT_KEY, { base: ADMIN.stale ? ADMIN.staleBase : PUBLISHED_HASH, at: Date.now(), data: ADMIN.draft })) {
      toast('This browser could not keep a backup of your draft. Publish soon so you do not lose it.', { bad: true, ms: 6000 });
    }
  }
  function restoreDraft() {
    var st = lsGet(DRAFT_KEY);
    if (!st || !st.data) return;
    var d = normalize(st.data);
    if (sameAsPublished(d)) { lsDel(DRAFT_KEY); return; }
    ADMIN.draft = d; ADMIN.dirty = true;
    ADMIN.stale = st.base !== PUBLISHED_HASH; ADMIN.staleBase = st.base;
    S = ADMIN.draft; renderAll(); showPreviewBar();
  }
  function startDraft() {
    if (!ADMIN.draft) { ADMIN.draft = clone(PUBLISHED); ADMIN.dirty = false; ADMIN.stale = false; }
    S = ADMIN.draft;
  }
  function discardDraft() {
    ADMIN.draft = null; ADMIN.dirty = false; ADMIN.stale = false; ADMIN.editId = null; ADMIN.problems = []; ADMIN.pubError = '';
    lsDel(DRAFT_KEY);
    S = clone(PUBLISHED);
    CART = loadCart();
    if (ADMIN.open) { startDraft(); renderAdmin(); }
    hidePreviewBar(); renderAll();
    toast('Changes discarded. The store shows the published version.');
  }
  function draftChanged(opts) {

      '<div class="ord-acts"><button class="btn sm" type="button" data-ord="read">Read order</button><button class="btn sm ghost" type="button" data-ord="clear">Clear</button></div><div id="ordPreview">' + ordPreviewHTML() + '</div></div>' +
      '<div class="adm-card"><div class="head"><h3>Saved orders</h3></div><div class="ord-filter"><div class="field"><label for="ord-q">Search</label><input id="ord-q" data-of-q placeholder="Code, name, phone or reference" value="' + esc(ORD.q) + '"></div>' +
      '<div class="field"><label for="ord-st">Status</label><select id="ord-st" data-of-st><option value="all">All</option>' + ORD_STATUS.map(function (s) { return '<option' + (ORD.st === s ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></div></div>' +
      '<div id="ordList">' + ordListHTML() + '</div></div>';
  }
  function ordPaintSummary() { var s = $('#ordSum'); if (s) s.innerHTML = ordSumHTML(); ordPaintTrack(); }
  function ordPaintPreview() { var p = $('#ordPreview'); if (p) p.innerHTML = ordPreviewHTML(); }
  function ordPaint() { ORD.stale = false; ordPaintSummary(); ordPaintPreview(); var l = $('#ordList'); if (l) l.innerHTML = ordListHTML(); }
  function ordArm(key) {
    if (ORD.armed === key) return true;
    ORD.armed = key; ordPaint();
    clearTimeout(ordArm.t); ordArm.t = setTimeout(function () { if (ORD.armed === key) { ORD.armed = null; if (ordOpenTab()) ordPaint(); } }, 4500);
    return false;
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-ord]'); if (!el || !ordOpenTab()) return;
    var a = el.getAttribute('data-ord'), code = el.getAttribute('data-code');
    if (a === 'read') { var ta = $('#ord-paste'); if (ta) ORD.paste = ta.value; ORD.parsed = ordParse(ORD.paste); ordPaintPreview(); return; }
    if (a === 'clear') { ORD.paste = ''; ORD.parsed = null; var t2 = $('#ord-paste'); if (t2) t2.value = ''; ordPaintPreview(); return; }
    if (a === 'save') { ordSave(); return; }
    if (a === 'pubtrack') { ordPublishTrack(); return; }
    if (a === 'toggle') { ORD.open = ORD.open === code ? null : code; ORD.armed = null; ordPaint(); return; }
    if (a === 'del') { if (!ordArm('del-' + code)) return; ORD.armed = null; ORD.open = null; ordDelete(code); return; }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-of-paste')) { ORD.paste = t.value; if (ORD.parsed) { ORD.parsed = null; ordPaintPreview(); } return; }
    if (t.hasAttribute && t.hasAttribute('data-of-q')) { ORD.q = t.value; var l = $('#ordList'); if (l) l.innerHTML = ordListHTML(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target; if (!t.getAttribute) return;
    if (t.hasAttribute('data-of-st')) { ORD.st = t.value; var l = $('#ordList'); if (l) l.innerHTML = ordListHTML(); return; }
    var f = t.getAttribute('data-of'), code = t.getAttribute('data-code'); if (!f || !code) return;
    var v = t.value, patch = {};
    if (f === 'received') { var n = ordNum(v); if (n < 0) { toast('The amount cannot be negative.', { bad: true }); return; } patch.received = n; }
    else patch[f] = v;
    ordUpdate(code, patch);
  });
  document.addEventListener('focusout', function () { if (ORD.stale) setTimeout(function () { var ae = document.activeElement; if (!(ae && ae.getAttribute && ae.getAttribute('data-code'))) ordRefresh(); }, 120); });

  /* ------------------------------ order tracking ------------------------------
     Customers cannot read the page's database, so each order is published inside the page,
     encrypted with a key made from the order code and the phone number. Only someone who knows
     both can open a record. The owner publishes updates from Manage store > Orders.
     --------------------------------------------------------------------------- */
  var TRK_STEPS = ['Pending payment', 'Paid', 'Ordered from supplier', 'Shipped', 'Arrived Ghana', 'Ready for pickup', 'Delivered'];
  var TRK_ITER = 60000, MINE_KEY = 'otr-my-orders-v1';
  var TRK = { code: '', phone: '', busy: false, res: null };
  function cryptoOK() { try { return !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues && typeof TextEncoder !== 'undefined' && typeof TextDecoder !== 'undefined'); } catch (e) { return false; } }
  function b64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function unb64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function trackCode(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function trackPhone(p) { var d = String(p || '').replace(/\D/g, ''); return d.length >= 9 ? d.slice(-9) : ''; }
  function newSalt() { var u = new Uint8Array(16); window.crypto.getRandomValues(u); return b64(u); }
  function trackDerive(code, phone, salt) {
    var enc = new TextEncoder(), sub = window.crypto.subtle;
    return sub.importKey('raw', enc.encode(trackCode(code) + '|' + trackPhone(phone)), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return sub.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('otr-track|' + salt), iterations: TRK_ITER }, k, 384);
    }).then(function (bits) {
      var u = new Uint8Array(bits);
      return { id: b64(u.slice(0, 16)).replace(/[^A-Za-z0-9]/g, ''), key: u.slice(16) };
    });
  }
  function ordPublicView(o) {
    var nm = String(o.name || '').trim().split(/\s+/)[0] || '';
    return { c: o.code, n: nm, b: o.batch || '', s: o.status || 'Pending payment',
      it: (o.items || []).map(function (x) { return { t: x.text, q: x.qty, a: x.amount }; }),
      tot: ordNum(o.itemsTotal), due: ordDue(o), rec: ordNum(o.received), pm: o.payMethod || '', sh: o.shipping || '',
      note: String(o.customerNote || '').slice(0, 500), at: o.updatedAt || o.createdAt || 0 };
  }
  function ordTrackSigNow() {
    var views = ORD.list.map(function (o) { var v = ordPublicView(o); delete v.at; return v; }).sort(function (a, b) { return a.c < b.c ? -1 : 1; });
    return hash(JSON.stringify(views));
  }
  function trackBuild(list, salt) {
    var enc = new TextEncoder(), sub = window.crypto.subtle, recs = [], p = Promise.resolve();
    list.forEach(function (o) {
      if (!trackPhone(o.phone) || !trackCode(o.code)) return;
      p = p.then(function () {
        return trackDerive(o.code, o.phone, salt).then(function (d) {
          return sub.importKey('raw', d.key, 'AES-GCM', false, ['encrypt']).then(function (k) {
            var iv = new Uint8Array(12); window.crypto.getRandomValues(iv);
            return sub.encrypt({ name: 'AES-GCM', iv: iv }, k, enc.encode(JSON.stringify(ordPublicView(o)))).then(function (ct) { recs.push({ i: d.id, n: b64(iv), c: b64(ct) }); });
          });
        });
      });
    });
    return p.then(function () {
      var avg = recs.length ? Math.round(recs.reduce(function (s, r) { return s + r.c.length; }, 0) / recs.length) : 400;
      while (recs.length % 10 !== 0 || recs.length === 0) {
        var a = new Uint8Array(16), b = new Uint8Array(12), c = new Uint8Array(Math.max(32, Math.round(avg * 0.75)));
        window.crypto.getRandomValues(a); window.crypto.getRandomValues(b);
        for (var off = 0; off < c.length; off += 65536) window.crypto.getRandomValues(c.subarray(off, Math.min(c.length, off + 65536)));
        recs.push({ i: b64(a).replace(/[^A-Za-z0-9]/g, ''), n: b64(b), c: b64(c) });
      }
      for (var j = recs.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)), t = recs[j]; recs[j] = recs[k]; recs[k] = t; }
      return { recs: recs, sig: ordTrackSigNow() };
    });
  }
  function withTrack(base, strict) {
    var out = clone(base);
    if (!ADMIN.db || !ORD.ready || ORD.error || !cryptoOK()) return strict ? Promise.reject({ code: 'no_track' }) : Promise.resolve(out);
    var salt = out.trackSalt || newSalt();
    return trackBuild(ORD.list, salt).then(function (r) { out.trackSalt = salt; out.track = r.recs; out.trackSig = r.sig; out.trackAt = Date.now(); return out; },
      function (e) { if (strict) throw e; return out; });
  }
  function ordTrackCardHTML() {
    var pub = PUBLISHED, has = pub.trackAt > 0, changed = !ORD.ready ? false : (has ? pub.trackSig !== ordTrackSigNow() : ORD.list.length > 0);
    var when = has ? new Date(pub.trackAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    var pill = !ORD.ready ? '' : changed ? '<span class="pill warn">Customers are not seeing your latest changes</span>' : '<span class="pill ok">Customers see the latest</span>';
    return '<div class="head"><h3>Customer order tracking</h3>' + pill + '</div>' +
      '<p class="adm-note">Customers open <b>Track order</b> and enter their order code and phone number. They see the status, items and payment you have recorded. Customers only see changes after you press the button below' + (when ? '. Last published: ' + esc(when) : '') + '.</p>' +
      (ADMIN.dirty ? '<p class="adm-note">You also have unpublished store changes. This button does not publish them. Use the Publish tab for those.</p>' : '') +
      (!cryptoOK() ? '<div class="problems">This browser cannot encrypt customer records, so tracking cannot be published from here.</div>' : '') +
      '<div class="ord-acts"><button class="btn sm gold" type="button" data-ord="pubtrack"' + (ORD.pubBusy || !ORD.ready || !!ORD.error || !cryptoOK() ? ' disabled' : '') + '>' + (ORD.pubBusy ? 'Publishing…' : 'Publish order updates') + '</button></div>';
  }
  function ordPaintTrack() { var t = $('#ordTrack'); if (t) t.innerHTML = ordTrackCardHTML(); }
  function ordPublishTrack() {
    if (ORD.pubBusy || !ADMIN.art || !ADMIN.db || !ORD.ready) return;
    ORD.pubBusy = true; ordPaintTrack();
    withTrack(PUBLISHED, true).then(function (data) {
      var html = buildDocument(data);
      if (html.length > 15 * 1048576) throw { code: 'too_large' };
      ssSet(PUB_FLAG, String(Date.now()));
      return ADMIN.art.publish(html);
    }).then(function () { ORD.pubBusy = false; toast('Published. Customers now see the latest order updates.', { ms: 5000 }); },
      function (err) {
        ORD.pubBusy = false; ssDel(PUB_FLAG); ordPaintTrack();
        toast(err && err.code === 'no_track' ? 'Order tracking could not be prepared in this view.' : publishErrorText(err && err.code), { bad: true, ms: 7000 });
      });
  }

  /* customer side */
  function mineGet() { var l = lsGet(MINE_KEY); return Array.isArray(l) ? l : []; }
  function rememberOrder() {
    if (!CART.code || !CART.form || !trackPhone(CART.form.phone)) return;
    var l = mineGet().filter(function (x) { return x.code !== CART.code; });
    l.unshift({ code: CART.code, phone: CART.form.phone, at: Date.now() });
    lsSet(MINE_KEY, l.slice(0, 10));
  }
  function openTrack() {
    var m = mineGet();
    if (!TRK.code && !TRK.phone && m.length) { TRK.code = m[0].code; TRK.phone = m[0].phone; }
    openSheet('track', 'side', '', 'Track your order'); renderTrackSheet();
  }
  function trkMoney(v) {
    var bal = Math.max(0, v.due - v.rec), msg;
    if (v.s === 'Cancelled') msg = 'This order was cancelled. If you have already paid, message us on WhatsApp.';
    else if (v.rec <= 0) msg = 'We have not recorded a payment yet. Pay ' + money(v.due) + (v.pm ? ' by ' + esc(v.pm) : '') + ' and use <b class="mono">' + esc(v.c) + '</b> as the payment reference.' + (S.store.payNote ? ' ' + esc(S.store.payNote) : '');
    else if (bal > 0.005) msg = 'We have recorded ' + money(v.rec) + '. Balance to pay: ' + money(bal) + '. Use <b class="mono">' + esc(v.c) + '</b> as the payment reference.';
    else msg = 'Payment recorded: ' + money(v.rec) + '. Thank you.';
    return msg;
  }
  function trkResultHTML() {
    var r = TRK.res; if (!r) return '';
    if (r.err) return '<div class="trk-err" role="alert">' + esc(r.err) + '</div>';
    var v = r.v, idx = TRK_STEPS.indexOf(v.s), steps = '';
    if (v.s !== 'Cancelled') steps = '<ol class="trk-steps" aria-label="Order progress">' + TRK_STEPS.map(function (s, i) { return '<li class="' + (i < idx ? 'done' : i === idx ? 'on' : '') + '"' + (i === idx ? ' aria-current="step"' : '') + '>' + esc(s) + '</li>'; }).join('') + '</ol>';
    var items = v.it.map(function (x) { return '<li>' + esc(x.t) + ' × ' + x.q + ' = ' + money(x.a) + '</li>'; }).join('');
    var upd = v.at ? new Date(v.at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    return '<div class="trk-card" aria-live="polite"><div class="trk-top"><span class="trk-code">' + esc(v.c) + '</span><span class="pill ' + (v.s === 'Cancelled' ? 'crit' : v.s === 'Delivered' ? 'ok' : 'warn') + '">' + esc(v.s) + '</span></div>' +
      (v.n ? '<p>Hello ' + esc(v.n) + ', here is your order.</p>' : '') + steps +
      '<ul class="trk-items">' + items + '</ul>' +
      '<div class="waybill"><div class="wb-row"><span>Item total</span><span>' + money(v.tot) + '</span></div><div class="wb-row"><span>Payment recorded</span><span>' + money(v.rec) + '</span></div>' +
      '<div class="wb-row"><span>Shipping fee</span><span>' + esc(v.sh || 'Confirmed at pickup') + '</span></div>' +
      (S.batch.arrives && v.s !== 'Delivered' && v.s !== 'Cancelled' ? '<div class="wb-row"><span>Expected in Ghana</span><span>' + esc(S.batch.arrives) + '</span></div>' : '') + '</div>' +
      '<p class="trk-note">' + trkMoney(v) + '</p>' + (v.note ? '<p class="trk-note">' + esc(v.note) + '</p>' : '') +
      '<p class="fine">Updated ' + esc(upd) + '. This page shows what we last published. If you have just paid, it can take a little while to appear. Message us on WhatsApp ' + esc(S.contact.whatsapp) + ' if anything looks wrong.</p></div>';
  }
  function renderTrackSheet() {
    var sh = $('#sheet'); if (!sh || SHEET.kind !== 'track') return;
    var m = mineGet(), ok = cryptoOK();
    var chips = m.length ? '<div><p class="fine" style="margin-bottom:8px">Orders sent from this device</p><div class="trk-chips">' + m.map(function (x, i) { return '<button class="btn sm ghost" type="button" data-trk-use="' + i + '">' + esc(x.code) + '</button>'; }).join('') + '</div></div>' : '';
    sh.innerHTML = '<div class="sheet-head"><h2>Track your order</h2><button class="iconbtn" type="button" data-close aria-label="Close">' + ICON.x + '</button></div>' +
      '<div class="sheet-body"><div class="trk-form"><p class="muted">Enter your order code and the phone number you ordered with. Your order appears here after we have recorded it, usually once we reply on WhatsApp.</p>' + chips +
      '<div class="field"><label for="trk-code">Order code</label><input id="trk-code" data-trk="code" value="' + esc(TRK.code) + '" placeholder="OTR-B1-XXXX" autocapitalize="characters" autocomplete="off" data-autofocus></div>' +
      '<div class="field"><label for="trk-phone">Phone number</label><input id="trk-phone" data-trk="phone" type="tel" inputmode="tel" value="' + esc(TRK.phone) + '" placeholder="0XX XXX XXXX" autocomplete="tel"></div>' +
      (ok ? '' : '<div class="trk-err">This browser cannot open order records. Message us on WhatsApp ' + esc(S.contact.whatsapp) + ' for an update.</div>') +
      '<button class="btn gold block" type="button" data-trk-go' + (TRK.busy || !ok ? ' disabled' : '') + '>' + (TRK.busy ? 'Looking…' : 'Find my order') + '</button>' +
      '<div id="trkRes">' + trkResultHTML() + '</div></div></div>';
  }
  function trackLookup() {
    if (TRK.busy) return;
    if (!trackCode(TRK.code) || !trackPhone(TRK.phone)) { TRK.res = { err: 'Enter your order code and the phone number you ordered with.' }; renderTrackSheet(); return; }
    var recs = S.track || [];
    TRK.busy = true; TRK.res = null; renderTrackSheet();
    function fail() { TRK.busy = false; TRK.res = { err: 'We could not find an order with that code and phone number. Check them, or message us on WhatsApp ' + S.contact.whatsapp + '. New orders appear here after we have recorded them.' }; renderTrackSheet(); }
    trackDerive(TRK.code, TRK.phone, S.trackSalt || '').then(function (d) {
      var rec = null; for (var i = 0; i < recs.length; i++) if (recs[i].i === d.id) { rec = recs[i]; break; }
      if (!rec) { fail(); return; }
      return window.crypto.subtle.importKey('raw', d.key, 'AES-GCM', false, ['decrypt']).then(function (k) {
        return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(rec.n) }, k, unb64(rec.c));
      }).then(function (pt) {
        TRK.busy = false; TRK.res = { v: JSON.parse(new TextDecoder().decode(pt)) }; renderTrackSheet();
      }, fail);
    }).catch(function () { TRK.busy = false; TRK.res = { err: 'Something went wrong while looking up your order. Try again, or message us on WhatsApp ' + S.contact.whatsapp + '.' }; renderTrackSheet(); });
  }
  document.addEventListener('click', function (e) {
    var t = e.target, el;
    if ((el = t.closest('[data-trk-go]'))) { e.preventDefault(); trackLookup(); return; }
    if ((el = t.closest('[data-trk-use]'))) { var m = mineGet()[+el.getAttribute('data-trk-use')]; if (m) { TRK.code = m.code; TRK.phone = m.phone; TRK.res = null; renderTrackSheet(); trackLookup(); } return; }
  });
  document.addEventListener('input', function (e) { var t = e.target; if (t.hasAttribute && t.hasAttribute('data-trk')) { TRK[t.getAttribute('data-trk')] = t.value; } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.hasAttribute && e.target.hasAttribute('data-trk')) { e.preventDefault(); trackLookup(); } });

  /* ------------------------------ start ------------------------------ */
  function productLink(p) { return (S.store.storeLink || 'https://claude.ai/artifact/K2YrQZMpnQbk7wZMuwLepm') + '#p' + p.id; }
  function openFromHash() {
    var m = /^#p(\d+)$/.exec(location.hash || ''); if (!m) return;
    var p = productById(m[1]); if (p && p.status !== 'hidden') openProduct(p.id);
  }
  window.addEventListener('hashchange', openFromHash);
  renderApp();
  openFromHash();
  initOwner();
  setInterval(function () { if (!ADMIN.open) { renderHero(); refreshCards(); } }, 60 * 60 * 1000);
})();
</script>
</body></html>
